<title id="title">The proposed bridge to embryonic geometry</title><desc id="desc">Molecular activity must constrain active stress. Stress and material response enter mechanics; deformation determines geometry. The current certificates establish selected finite-model consequences, while molecular calibration and experimental validation remain open.</desc>
